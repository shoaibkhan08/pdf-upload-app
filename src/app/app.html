<header class="main-header">
		<div class="header-inner">
			<h1>NIC Project</h1>
		</div>
</header>

<div class="upload-card">
	<form [formGroup]="uploadForm" (ngSubmit)="submit()">
			<div class="upload-header">
				<div style="display:flex;align-items:center">
					<h2>Upload PDFs</h2>
					<div class="upload-desc">Upload up to 5 PDF files — drag or pick multiple at once.</div>
				</div>
			</div>

				<div class="file-input-row">
					<label class="file-chooser">
						<input type="file" accept=".pdf" multiple (change)="onFilesChange($event)" aria-label="Choose PDF files" />
					<span class="file-chooser-button">{{ filledCount ? ('Choose files (' + filledCount + ')') : 'Choose files' }}</span>
						<span class="file-chooser-text" aria-hidden="true">(PDF only, up to 5)</span>
					</label>
					<button type="button" class="btn danger" (click)="clearAll()">Clear All</button>
				</div>

		<ul class="slots">
					<li class="slot" [class.filled]="!!selectedFiles[key]" *ngFor="let key of keys">
						<div class="slot-row">
							<div class="slot-info">
								<div class="label">{{ labelMap[key] }}</div>
								<div class="filename" *ngIf="selectedFiles[key]">{{ selectedFiles[key]?.name }}</div>
								<div class="no-file" *ngIf="!selectedFiles[key]">No file</div>
							</div>
							<div class="slot-actions">
								<button type="button" class="btn clear" (click)="clearKey(key)">Clear</button>
							</div>
						</div>
					</li>
		</ul>

				<div *ngIf="errorMsg"
						 [class.duplicate]="isDuplicateError"
						 [class.warning]="isWarningError"
						 [class.error]="!isDuplicateError && !isWarningError">
					{{errorMsg}}
				</div>

				<div *ngIf="successMsg" class="success">{{ successMsg }}</div>

			<div style="margin-top:14px">
						<button class="btn primary" type="submit" [disabled]="submitting">{{ submitting ? 'Uploading...' : 'Submit' }}</button>
			</div>
	</form>
</div>
